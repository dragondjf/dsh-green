# ============================================================
# DSH Green Pack - CI Build & Release
# ============================================================
# 触发:
#   - push tag v*          -> 构建全部平台 + 自动创建 GitHub Release
#   - workflow_dispatch     -> 仅构建产物(不上 Release), 用于调试/重跑
# 说明:
#   makefile 自带 Node 下载(corepack/pnpm)与平台检测,
#   本工作流只需提供 runner + make + 网络(npm registry)。
#   win7 任务跑在 windows-latest: makefile 的 win7 zip 在 Windows 上走
#   Compress-Archive 兜底, 才能产出真正的 .zip (GNU tar 不支持写 zip)。
# ============================================================

name: Build DSH Green Pack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 ref 并发去重; tag 唯一故互不取消, dispatch 重跑会取消旧 run
concurrency:
  group: dsh-green-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 用于 softprops/action-gh-release 创建 Release

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 全部用 bash(git bash on Windows)保证 make/unzip/tar 可用
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: archive
            asset: dsh-green-linux-v22.19.0.tar.gz
          - name: darwin-arm64
            os: macos-latest
            target: archive
            asset: dsh-green-darwin-v22.19.0.tar.gz
          - name: windows-x64
            os: windows-latest
            target: archive
            asset: dsh-green-windows-v22.19.0.tar.gz
          - name: win7-x64
            os: windows-latest
            target: win7
            asset: dsh-green-win7-v22.22.3.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unzip available
        # makefile 解压 Node 需要 unzip; ubuntu 镜像可能未预装
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            if [ "${{ runner.os }}" = "Linux" ]; then
              sudo apt-get update -y && sudo apt-get install -y unzip
            else
              echo "::error::unzip missing on ${{ runner.os }}"; exit 1
            fi
          fi

      - name: Build green pack
        run: make ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-green-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      # ============================================================
      # E2E: 解压产物 -> 启动 green pack -> Playwright 全链路 -> 截图
      # 失败即阻断本 job (进而阻断 Release), 保证发布前验证通过
      # ============================================================
      - name: Extract green pack for E2E
        run: |
          mkdir -p e2e/${{ matrix.name }}
          ASSET="${{ matrix.asset }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: bsdtar (tar) 自动识别 zip/gz, 最稳; 失败回退 powershell
            if tar xf "$ASSET" -C e2e/${{ matrix.name }} 2>/dev/null; then
              echo "extracted via tar(bsdtar): $ASSET"
            else
              echo "tar failed, powershell Expand-Archive: $ASSET"
              powershell -Command "Expand-Archive -Force '$ASSET' 'e2e/${{ matrix.name }}'"
            fi
          else
            # 非 Windows: gzip/tar 优先, 失败回退 unzip (真 zip)
            if tar xzf "$ASSET" -C e2e/${{ matrix.name }} 2>/dev/null; then
              echo "extracted via tar: $ASSET"
            else
              echo "tar failed, falling back to unzip: $ASSET"
              unzip -o "$ASSET" -d e2e/${{ matrix.name }}
            fi
          fi
          echo "=== extracted tree ==="
          ls -laR e2e/${{ matrix.name }} 2>/dev/null | head -60 || true

      - name: Locate run script in extracted pack
        id: locate
        shell: bash
        run: |
          # 找到含 run.sh / run.bat 的目录 (放宽深度, 适配不同打包结构)
          PACK_DIR=$(find e2e/${{ matrix.name }} -name 'run.sh' -o -name 'run.bat' | head -1 | xargs dirname 2>/dev/null)
          if [ -z "$PACK_DIR" ]; then
            echo "::error::run.sh/run.bat not found in extracted pack"; exit 1
          fi
          echo "pack_dir=$PACK_DIR" >> "$GITHUB_OUTPUT"
          echo "found pack dir: $PACK_DIR"

      - name: Start DSH web server
        id: start
        shell: bash
        run: |
          PACK_DIR="${{ steps.locate.outputs.pack_dir }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: 用 cmd /c 启动 .bat (git-bash 下最稳)
            WIN_BAT="$(cygpath -w "$PACK_DIR/run.bat" 2>/dev/null || echo "$PACK_DIR/run.bat")"
            CMD=(cmd //c "$WIN_BAT")
          else
            # Linux/macOS: bash 启动 .sh
            chmod +x "$PACK_DIR/run.sh"
            CMD=(bash "$PACK_DIR/run.sh")
          fi
          echo "launching: ${CMD[*]}"
          # 后台启动, 日志落盘便于诊断 (数组展开, 避免引号被当作路径一部分)
          nohup "${CMD[@]}" > e2e/${{ matrix.name }}/dsh.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          echo "launched pid=$!"

      - name: Wait for DSH web (127.0.0.1:3080)
        shell: bash
        run: |
          URL="http://127.0.0.1:3080"
          for i in $(seq 1 60); do
            if curl -fsS "$URL" -o /dev/null 2>/dev/null; then
              echo "DSH web ready after ${i}x2s"; exit 0
            fi
            sleep 2
          done
          echo "::error::DSH web did not come up on $URL within 120s"
          echo "=== dsh.log tail ==="
          tail -40 e2e/${{ matrix.name }}/dsh.log 2>/dev/null
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          cd tests
          npm install
          # 仅装 chromium (够截图); 失败则给出明确错误
          npx playwright install --with-deps chromium || npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      - name: Run Playwright E2E + screenshot
        shell: bash
        run: |
          mkdir -p e2e/${{ matrix.name }}/screenshots
          cd tests
          DSH_URL="http://127.0.0.1:3080" \
          SHOT="../e2e/${{ matrix.name }}/screenshots/${{ matrix.name }}.png" \
          PLAYWRIGHT_BROWSERS_PATH="${{ github.workspace }}/pw-browsers" \
            node e2e.mjs

      - name: Stop DSH web server
        if: always()
        shell: bash
        run: |
          PID="${{ steps.start.outputs.pid }}"
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-e2e-${{ matrix.name }}
          path: e2e/${{ matrix.name }}/screenshots/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 仅 tag 推送时创建 Release(dispatch 只产出 artifacts)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-green-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-screenshots:
    name: Push E2E screenshots to repo
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all E2E screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-e2e-*
          merge-multiple: true
          path: e2e-shots

      - name: Commit & push screenshots
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "screenshots/${TAG}"
          # 把下载的截图整理进 screenshots/<tag>/
          find e2e-shots -type f -name '*.png' -exec cp -v {} "screenshots/${TAG}/" \;
          git config user.name "dsh-ci"
          git config user.email "dsh-ci@noreply.local"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "no screenshot changes to commit"
            exit 0
          fi
          git commit -m "ci: add E2E screenshots for ${TAG}"
          git pull --rebase --autostash origin main || true
          git push origin main
