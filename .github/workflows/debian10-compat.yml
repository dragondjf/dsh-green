# ============================================================
# DSH Green Pack - Debian 10 (Kernel 4.19) 兼容性构建验证
# ============================================================
# 目的: 在 QEMU 虚拟机里运行 Debian 10 (Buster, 内核 4.19),
#       验证 dsh-green 能在老内核环境下同样构建成功。
# 架构: amd64 (x86 原生 runner) + arm64 (ARM 原生 runner)
# 注: GitHub 公共 runner 无 /dev/kvm, 故用纯 TCG 模拟 (无 KVM 加速)。
#     若用自托管带 KVM 的 runner, 可在矩阵 kvm_accel 里加 -enable-kvm。
# 触发: push main / workflow_dispatch (独立验证, 不挂 Release 链路)
# ============================================================

name: Debian10 Compat Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-on-debian10:
    name: Build on Debian 10 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- x86_64 (amd64) ----------
          - arch: amd64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            qemu_bin: qemu-system-x86_64
            machine: pc
            cpu: qemu64
            img_url: https://cdimage.debian.org/cdimage/openstack/current-10/debian-10-openstack-amd64.qcow2
            img_name: debian10-amd64.qcow2
            root_dev: /dev/sda1
            console: ttyS0
            disk_if: virtio-blk-pci
            net_if: virtio-net-pci
            kernel_glob: /boot/vmlinuz-4.19*
            initrd_glob: /boot/initrd.img-4.19*

          # ---------- ARM64 (aarch64) ----------
          # 注意: GitHub 公共原生 ARM runner 标签是 ubuntu-24.04-arm64 (非 -arm)
          - arch: arm64
            runner: ubuntu-24.04-arm64
            qemu_pkg: qemu-system-arm
            qemu_bin: qemu-system-aarch64
            machine: virt
            cpu: cortex-a57
            img_url: https://cdimage.debian.org/cdimage/openstack/current-10/debian-10-openstack-arm64.qcow2
            img_name: debian10-arm64.qcow2
            root_dev: /dev/vda1
            console: ttyAMA0
            disk_if: virtio-blk-device
            net_if: virtio-net-device
            kernel_glob: /boot/vmlinuz-4.19*
            initrd_glob: /boot/initrd.img-4.19*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.qemu_pkg }} \
            qemu-utils \
            libguestfs-tools \
            wget \
            git

      - name: Download Debian 10 cloud image
        run: |
          wget -q -L -O ${{ matrix.img_name }} ${{ matrix.img_url }}
          qemu-img resize ${{ matrix.img_name }} +4G

      # 提取内核 4.19 + initrd, 验证老内核可用 (用 virt-copy-out 一次性提取, 比 guestmount 稳)
      - name: Extract Kernel 4.19 and initrd
        run: |
          virt-copy-out -a ${{ matrix.img_name }} ${{ matrix.kernel_glob }} ${{ matrix.initrd_glob }} . || {
            echo "::error::无法从镜像提取 4.19 内核/initrd"; exit 1
          }
          # 归一化文件名 (通配可能带版本后缀)
          mv -f vmlinuz-4.19* vmlinuz 2>/dev/null || true
          mv -f initrd.img-4.19* initrd.img 2>/dev/null || true
          ls -la vmlinuz initrd.img
          echo "extracted kernel: $(file vmlinuz | cut -d: -f2-)"

      # 离线注入: 设 root 密码 + 首次启动自动 clone&构建 dsh-green
      # (避免串口交互式 login 的脆弱; makefile 自带 node 22.19 下载, VM 内只需 make+git)
      - name: Inject build script (virt-customize firstboot)
        run: |
          cat > /tmp/firstboot.sh <<'EOF'
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y make git
          cd /root
          rm -rf dsh-green
          git clone --depth 1 https://github.com/dragondjf/dsh-green.git
          cd dsh-green
          make archive 2>&1 | tee /root/build.log
          if [ -f "dsh-green/run.sh" ] || [ -f "dsh-green/run.bat" ]; then
            echo "BUILD_OK" >> /root/build.log
          else
            echo "BUILD_FAIL" >> /root/build.log
          fi
          echo "=== build finished ===" >> /root/build.log
          poweroff
          EOF
          chmod +x /tmp/firstboot.sh
          # 设 root 密码 (ci) 以便调试; firstboot 注入构建脚本
          virt-customize -a ${{ matrix.img_name }} \
            --root-password password:ci \
            --firstboot /tmp/firstboot.sh || {
            echo "::error::virt-customize 注入失败"; exit 1
          }

      # 启动 QEMU, 用提取出的 4.19 内核直接引导 cloud 镜像, 串口看构建过程
      - name: Boot Debian 10 and build dsh-green in QEMU
        timeout-minutes: 40
        run: |
          echo "=== QEMU boot: Debian 10 kernel 4.19 on ${{ matrix.arch }} ==="
          # -nographic 把串口输出到 stdout; VM 内 firstboot 跑完会 poweroff, QEMU 退出
          ${{ matrix.qemu_bin }} \
            -M ${{ matrix.machine }} \
            -m 3072 \
            -smp 2 \
            -cpu ${{ matrix.cpu }} \
            -kernel ./vmlinuz \
            -initrd ./initrd.img \
            -append "root=${{ matrix.root_dev }} console=${{ matrix.console }} rw" \
            -drive file=${{ matrix.img_name }},format=qcow2,if=none,id=drive0 \
            -device ${{ matrix.disk_if }},drive=drive0 \
            -netdev user,id=net0,hostfwd=tcp::10022-:22 \
            -device ${{ matrix.net_if }},netdev=net0 \
            -nographic \
            -no-reboot || true
          echo "=== QEMU process exited (VM powered off or timeout) ==="

      # 重新挂载镜像, 取回构建日志判定结果 (用 guestfish 只读取, 避免 guestmount appliance 重建)
      - name: Collect build result
        run: |
          mkdir -p /tmp/vmroot
          # 用 guestfish 直接 cat, 不挂载整个 FS
          BUILD_RESULT=$(guestfish --ro -a ${{ matrix.img_name }} -m ${{ matrix.root_dev }} \
            "cat /root/build.log" 2>/dev/null | tail -5 || echo "NO_BUILD_LOG")
          echo "$BUILD_RESULT"
          echo "$BUILD_RESULT" | grep -q "BUILD_OK" && {
            echo "::notice::dsh-green built successfully on Debian 10 (4.19) ${{ matrix.arch }}"
            exit 0
          }
          echo "::error::dsh-green build did NOT complete OK on Debian 10 ${{ matrix.arch }}"
          echo "--- last build.log ---"
          echo "$BUILD_RESULT"
          exit 1
